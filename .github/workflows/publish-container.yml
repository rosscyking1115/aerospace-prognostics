name: Publish Container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional additional image tag, such as v0.1.0-rc1"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/serving

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Compute image tags
        id: image_tags
        run: |
          uv run python scripts/ci_container_publish_tags.py \
            --image-name "$IMAGE_NAME" \
            --github-sha "$GITHUB_SHA" \
            --github-ref-type "$GITHUB_REF_TYPE" \
            --github-ref-name "$GITHUB_REF_NAME" \
            --manual-tag "${{ inputs.image_tag }}" \
            --output-json artifacts/container/publish_tags.json

      - name: Build serving image
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          docker build \
            ${{ steps.image_tags.outputs.tag_args }} \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            .

      - name: Verify serving image dependency surface
        run: docker run --rm "${{ steps.image_tags.outputs.primary_ref }}" python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"

      - name: Generate serving image manifest
        run: |
          uv run python scripts/ci_serving_image_manifest.py \
            --image "${{ steps.image_tags.outputs.primary_ref }}" \
            --output-json artifacts/container/serving_image_manifest.json \
            --expected-revision "$GITHUB_SHA" \
            --check-torch-absent

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push serving image
        run: |
          for image_ref in ${{ steps.image_tags.outputs.published_refs }}; do
            docker push "$image_ref"
          done
