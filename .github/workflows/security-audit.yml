name: Security audit

# Dependabot opens a PR only when a fix exists. A CVE disclosed with no fixed
# release leaves it silent, and the first sign would otherwise be a blocked PR.
# This runs the same audit CI runs, on a schedule, so a disclosure surfaces as
# a failed scheduled run (which GitHub emails to the repo owner) instead.
#
# 2026-08-09: this is now the *only* failing signal for dependency advisories.
# The CI job's audit step became advisory on pull requests, so the cadence here
# has to carry the load the merge gate used to. Weekly left up to seven days
# between a disclosure and any notice of it, which was acceptable when a blocked
# PR would have caught it sooner; daily is the honest replacement. It costs one
# short job a day.
on:
  schedule:
    # Daily, 08:00 UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - name: Dependency audit
        run: uv run pip-audit
