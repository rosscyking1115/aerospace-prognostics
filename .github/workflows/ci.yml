name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Dependency audit
        run: uv run pip-audit --ignore-vuln CVE-2025-3000

      - name: Generate SBOM
        run: uv run aerospace-prognostics generate-sbom --lockfile uv.lock --output-json artifacts/sbom/cyclonedx.json

      - name: Smoke release evidence
        run: uv run python scripts/ci_release_evidence_smoke.py

      - name: Build serving image
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          docker build \
            --tag aerospace-prognostics:ci \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            .

      - name: Verify serving image healthcheck
        run: |
          healthcheck="$(docker image inspect aerospace-prognostics:ci --format '{{json .Config.Healthcheck.Test}}')"
          echo "$healthcheck"
          echo "$healthcheck" | grep aerospace_prognostics.serving.healthcheck

      - name: Verify serving image dependency surface
        run: docker run --rm aerospace-prognostics:ci python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"

      - name: Generate serving image manifest
        run: |
          uv run python scripts/ci_serving_image_manifest.py \
            --image aerospace-prognostics:ci \
            --output-json artifacts/container/serving_image_manifest.json \
            --expected-revision "$GITHUB_SHA" \
            --check-torch-absent

      - name: Build release candidate bundle
        run: |
          uv run aerospace-prognostics cmapss-release-bundle \
            --release-name ci-fd001-serving-candidate \
            --model-artifact artifacts/ci_release_evidence/models/fd001.joblib \
            --metadata-json artifacts/ci_release_evidence/models/fd001_metadata.json \
            --model-card-markdown artifacts/ci_release_evidence/models/fd001_model_card.md \
            --promotion-json artifacts/ci_release_evidence/models/fd001_promotion.json \
            --sbom-json artifacts/ci_release_evidence/sbom/cyclonedx.json \
            --dashboard-payload-json artifacts/ci_release_evidence/dashboard/fleet_payload.json \
            --dashboard-html artifacts/ci_release_evidence/dashboard/fleet_dashboard.html \
            --container-manifest-json artifacts/container/serving_image_manifest.json \
            --container-image-ref aerospace-prognostics:ci \
            --output-json artifacts/release/cmapss_fd001_release_bundle.json \
            --output-markdown artifacts/release/cmapss_fd001_release_bundle.md

      - name: Generate release provenance
        run: |
          uv run aerospace-prognostics generate-release-provenance \
            --release-bundle-json artifacts/release/cmapss_fd001_release_bundle.json \
            --output-json artifacts/release/cmapss_fd001_provenance.json \
            --output-markdown artifacts/release/cmapss_fd001_provenance.md

      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-fd001-release-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/cmapss_fd001_release_bundle.json
            artifacts/release/cmapss_fd001_release_bundle.md
            artifacts/release/cmapss_fd001_provenance.json
            artifacts/release/cmapss_fd001_provenance.md
            artifacts/ci_release_evidence/dashboard/fleet_payload.json
            artifacts/ci_release_evidence/dashboard/fleet_dashboard.html
            artifacts/ci_release_evidence/models/fd001_promotion.json
            artifacts/ci_release_evidence/models/fd001_promotion.md
            artifacts/ci_release_evidence/models/fd001_validation.json
            artifacts/ci_release_evidence/models/fd001_benchmark.json
            artifacts/ci_release_evidence/models/fd001_model_card.md
            artifacts/ci_release_evidence/sbom/cyclonedx.json
            artifacts/container/serving_image_manifest.json

      - name: Smoke serving image
        run: |
          container_id=$(docker run --detach --publish 8000:8000 aerospace-prognostics:ci)
          trap 'docker rm --force "$container_id"' EXIT
          response=""
          for attempt in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8000/health); then
              break
            fi
            sleep 1
          done
          echo "$response"
          if [ -z "$response" ]; then
            docker logs "$container_id"
            exit 1
          fi
          HEALTH_RESPONSE="$response" python -c "import json, os; payload = json.loads(os.environ['HEALTH_RESPONSE']); assert payload == {'status': 'missing_model', 'model_loaded': False}"
          ready_status=$(curl --silent --output /tmp/ready.json --write-out "%{http_code}" http://127.0.0.1:8000/ready)
          cat /tmp/ready.json
          test "$ready_status" = "503"
          READY_RESPONSE="$(cat /tmp/ready.json)" python -c "import json, os; payload = json.loads(os.environ['READY_RESPONSE']); assert payload == {'status': 'missing_model', 'model_loaded': False}"

      - name: Smoke serving image with mounted model
        run: |
          artifact_sha256=$(sha256sum artifacts/ci_release_evidence/models/fd001.joblib | cut -d ' ' -f1)
          container_id=$(docker run --detach --publish 8001:8000 \
            --volume "$PWD/artifacts/ci_release_evidence/models:/models:ro" \
            --env AEROSPACE_PROGNOSTICS_MODEL_PATH=/models/fd001.joblib \
            --env AEROSPACE_PROGNOSTICS_MODEL_SHA256="$artifact_sha256" \
            --env AEROSPACE_PROGNOSTICS_API_KEY=ci-secret \
            aerospace-prognostics:ci)
          trap 'docker rm --force "$container_id"' EXIT
          uv run python scripts/ci_serving_loaded_smoke.py \
            --base-url http://127.0.0.1:8001 \
            --input-csv artifacts/ci_release_evidence/predictions/fd001_input.csv \
            --api-key ci-secret

      - name: Free serving image before hosted demo image
        run: |
          docker image rm aerospace-prognostics:ci
          docker builder prune --force

      - name: Build hosted demo image
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          docker build \
            --file Dockerfile.demo \
            --tag aerospace-prognostics-demo:ci \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            .

      - name: Verify hosted demo image contract
        run: |
          env_config="$(docker image inspect aerospace-prognostics-demo:ci --format '{{json .Config.Env}}')"
          echo "$env_config"
          echo "$env_config" | grep AEROSPACE_PROGNOSTICS_CONSOLE_READ_ONLY=true
          docker run --rm aerospace-prognostics-demo:ci python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --volume "$PWD/scripts:/ci-scripts:ro" \
            aerospace-prognostics-demo:ci \
            python /ci-scripts/ci_demo_image_contract.py

      - name: Smoke hosted demo image
        run: |
          container_id=$(docker run --detach \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --publish 8502:8501 \
            aerospace-prognostics-demo:ci)
          trap 'docker rm --force "$container_id"' EXIT
          response=""
          for attempt in {1..45}; do
            if response=$(curl --fail --silent http://127.0.0.1:8502/_stcore/health); then
              break
            fi
            sleep 1
          done
          echo "$response"
          if [ -z "$response" ]; then
            docker logs "$container_id"
            exit 1
          fi
