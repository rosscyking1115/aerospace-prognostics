name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Dependency audit
        run: uv run pip-audit

      - name: Build serving image
        run: docker build --tag aerospace-prognostics:ci .

      - name: Smoke serving image
        run: |
          container_id=$(docker run --detach --publish 8000:8000 aerospace-prognostics:ci)
          trap 'docker rm --force "$container_id"' EXIT
          response=""
          for attempt in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8000/health); then
              break
            fi
            sleep 1
          done
          echo "$response"
          HEALTH_RESPONSE="$response" python -c "import json, os; payload = json.loads(os.environ['HEALTH_RESPONSE']); assert payload == {'status': 'missing_model', 'model_loaded': False}"
