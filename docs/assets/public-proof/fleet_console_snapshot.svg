<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Aerospace PHM quickstart operations console snapshot</title>
  <desc id="desc">A public proof asset summarizing the quickstart fleet dashboard with two critical C-MAPSS FD001 assets, release gates passed, and a promoted model evidence panel.</desc>
  <rect width="1280" height="720" fill="#f5f7fa"/>
