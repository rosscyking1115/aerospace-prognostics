<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Quickstart RUL diagnostic plot</title>
  <desc id="desc">Diagnostic plot showing predicted RUL intervals for two FD001 quickstart assets. Both assets have predicted RUL of 1.0 cycles and 90 percent intervals from 0.0 to 2.0 cycles.</desc>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="52" y="58" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Quickstart RUL Diagnostic</text>
  <text x="52" y="88" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="15">C-MAPSS FD001 predictions with train-residual absolute-quantile intervals</text>
  <line x1="132" y1="430" x2="888" y2="430" stroke="#111827" stroke-width="1.5"/>
  <line x1="132" y1="128" x2="132" y2="430" stroke="#111827" stroke-width="1.5"/>
  <g stroke="#dbe3ec" stroke-width="1">
    <line x1="132" y1="128" x2="132" y2="430"/>
    <line x1="283" y1="128" x2="283" y2="430"/>
    <line x1="434" y1="128" x2="434" y2="430"/>
    <line x1="585" y1="128" x2="585" y2="430"/>
    <line x1="736" y1="128" x2="736" y2="430"/>
    <line x1="887" y1="128" x2="887" y2="430"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">
    <text x="132" y="450" text-anchor="middle">0</text>
    <text x="283" y="450" text-anchor="middle">25</text>
    <text x="434" y="450" text-anchor="middle">50</text>
    <text x="585" y="450" text-anchor="middle">75</text>
    <text x="736" y="450" text-anchor="middle">100</text>
    <text x="887" y="450" text-anchor="middle">125</text>
  </g>
  <text x="510" y="496" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">Remaining useful life prediction, cycles</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15">
    <text x="52" y="214" fill="#111827" font-weight="700">FD001-unit-1</text>
    <text x="52" y="330" fill="#111827" font-weight="700">FD001-unit-2</text>
  </g>
  <g>
    <rect x="132" y="188" width="12" height="36" rx="6" fill="#fee2e2"/>
    <line x1="132" y1="206" x2="144" y2="206" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="138" cy="206" r="7" fill="#991b1b"/>
    <text x="158" y="211" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1.0 RUL, interval 0.0-2.0</text>
    <rect x="132" y="304" width="12" height="36" rx="6" fill="#fee2e2"/>
    <line x1="132" y1="322" x2="144" y2="322" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="138" cy="322" r="7" fill="#991b1b"/>
    <text x="158" y="327" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1.0 RUL, interval 0.0-2.0</text>
  </g>
  <rect x="620" y="142" width="268" height="132" rx="8" fill="#f8fafc" stroke="#d7dde5"/>
  <text x="644" y="178" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Operational interpretation</text>
  <text x="644" y="210" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">Both quickstart engines are below</text>
  <text x="644" y="232" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">the critical RUL threshold and enter</text>
  <text x="644" y="254" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">maintenance review.</text>
  <rect x="620" y="300" width="268" height="88" rx="8" fill="#f8fafc" stroke="#d7dde5"/>
  <text x="644" y="335" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Evidence hook</text>
  <text x="644" y="366" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">Source JSON: fd001_predictions.json</text>
  <text x="644" y="388" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">Interval confidence: 0.90</text>
  <text x="52" y="530" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Public proof asset generated from quickstart prediction evidence; use release bundles and model cards for auditable deployment details.</text>
</svg>
