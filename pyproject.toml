[project]
name = "aerospace-prognostics"
version = "0.1.0"
description = "Aerospace PHM pipeline for RUL prediction and spacecraft anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
dependencies = [
    "fastapi>=0.140.13",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "telemeval>=0.3.3",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
deep = [
    "torch>=2.3",
]

[project.scripts]
aerospace-prognostics = "aerospace_prognostics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerospace_prognostics"]

# The sdist contents are an ALLOWLIST, not an exclude list, and that is deliberate.
#
# hatchling honours the *repository's* .gitignore and nothing else. Ignores that live in a
# contributor's global gitignore -- `.claude/` and `graphify-out/` here -- are invisible
# both to `git status` and to the build backend, so they were being packaged. A build from
# this working tree carried `.claude/settings.local.json`, containing absolute machine
# paths, plus the whole `graphify-out/` knowledge-graph cache. Nothing publishes this
# package, so nothing leaked; the defect was found by building the artifact and opening it
# rather than by reading the source tree, which is where it hides.
#
# An exclude list only stops what someone thought to name, and fails open when a new
# local-only directory appears. An allowlist fails closed: a new directory is absent from
# the sdist until someone adds it here on purpose.
# `tests/test_sdist_contents.py` fails if this list ever admits an untracked path.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/notebooks",
  "/.github",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/claims.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
  "/streamlit_app.py",
  "/compose.yaml",
  "/Dockerfile",
  "/Dockerfile.demo",
  "/.dockerignore",
  "/.env.example",
  "/.gitignore",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "torch>=2.3",
]

[tool.uv]
# GitPython is transitive (Streamlit requires `gitpython!=3.1.19,<4,>=3.0.7`), so it
# cannot be pinned from `dependencies` without falsely declaring a direct import.
# Resolution had settled on 3.1.50, which now carries eight published advisories --
# GHSA-2f96-g7mh-g2hx, GHSA-v396-v7q4-x2qj, GHSA-956x-8gvw-wg5v (fixed 3.1.51),
# GHSA-3rp5-jjmw-4wv2 (3.1.53), GHSA-fjr4-x663-mwxc, GHSA-6p8h-3wgx-97gf,
# GHSA-r9mr-m37c-5fr3 (3.1.54) and GHSA-94p4-4cq8-9g67 (3.1.55) -- failing
# `pip-audit` in CI. Nothing in this repository changed: the same lockfile passed on
# 2026-07-18 and the advisory database moved under it.
#
# 3.1.55 is the lowest version clearing all eight and sits well inside Streamlit's
# own range, so this is a constraint rather than an override and no dependency is
# forced past what its parent permits.
constraint-dependencies = ["gitpython>=3.1.55"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# D2/D4 check the *shape* of docstrings that already exist. D1 (missing-docstring) is
# deliberately not selected: a docstring written only to satisfy a linter is worse than
# none, because it costs maintenance and teaches readers that docstrings here are noise.
# Coverage is prioritised by hand instead -- every module in the package carries a module
# docstring, and the public surface is documented ahead of private helpers.
select = ["E", "F", "I", "UP", "B", "SIM", "D2", "D4"]

[tool.ruff.lint.pydocstyle]
# Google style, matching the rest of these repositories. Recorded here so the linter and
# any documentation generator agree on one convention.
convention = "google"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
# Deliberately scoped, not repo-wide. The whole package currently emits ~330
# errors under default settings, mostly from argparse dispatch functions that
# rebind one `result` variable across many branches. Gating everything would
# mean either a mountain of suppressions or a permissive config that checks
# nothing. Instead this gates the numeric and evaluation core -- the code where
# a type error would corrupt a reported metric -- and the list ratchets upward
# as modules are cleaned. Never remove a module from this list to make CI pass.
files = [
    "src/aerospace_prognostics/metrics.py",
    "src/aerospace_prognostics/evaluation.py",
    "src/aerospace_prognostics/features.py",
    "src/aerospace_prognostics/sequences.py",
    "src/aerospace_prognostics/preprocessing.py",
    "src/aerospace_prognostics/data/esa_adb_mission.py",
    "src/aerospace_prognostics/data/esa_adb_scoring.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
