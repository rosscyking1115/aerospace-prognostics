[project]
name = "aerospace-prognostics"
version = "0.1.0"
description = "Aerospace PHM pipeline for RUL prediction and spacecraft anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
dependencies = [
    "fastapi>=0.139.2",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.59.2",
    "telemeval>=0.3.2",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
deep = [
    "torch>=2.3",
]

[project.scripts]
aerospace-prognostics = "aerospace_prognostics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerospace_prognostics"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "torch>=2.3",
]

[tool.uv]
# GitPython is transitive (Streamlit requires `gitpython!=3.1.19,<4,>=3.0.7`), so it
# cannot be pinned from `dependencies` without falsely declaring a direct import.
# Resolution had settled on 3.1.50, which now carries eight published advisories --
# GHSA-2f96-g7mh-g2hx, GHSA-v396-v7q4-x2qj, GHSA-956x-8gvw-wg5v (fixed 3.1.51),
# GHSA-3rp5-jjmw-4wv2 (3.1.53), GHSA-fjr4-x663-mwxc, GHSA-6p8h-3wgx-97gf,
# GHSA-r9mr-m37c-5fr3 (3.1.54) and GHSA-94p4-4cq8-9g67 (3.1.55) -- failing
# `pip-audit` in CI. Nothing in this repository changed: the same lockfile passed on
# 2026-07-18 and the advisory database moved under it.
#
# 3.1.55 is the lowest version clearing all eight and sits well inside Streamlit's
# own range, so this is a constraint rather than an override and no dependency is
# forced past what its parent permits.
constraint-dependencies = ["gitpython>=3.1.55"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
