[project]
name = "aerospace-prognostics"
version = "0.1.0"
description = "Aerospace PHM pipeline for RUL prediction and spacecraft anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
aerospace-prognostics = "aerospace_prognostics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerospace_prognostics"]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
