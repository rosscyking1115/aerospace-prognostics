[project]
name = "aerospace-prognostics"
version = "0.1.0"
description = "Aerospace PHM pipeline for RUL prediction and spacecraft anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
dependencies = [
    "fastapi>=0.139.2",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.59.2",
    "telemeval>=0.3.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
deep = [
    "torch>=2.3",
]

[project.scripts]
aerospace-prognostics = "aerospace_prognostics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerospace_prognostics"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "torch>=2.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
