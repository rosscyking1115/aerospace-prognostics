services:
  - type: web
    name: aerospace-prognostics-private-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: AEROSPACE_PROGNOSTICS_CONSOLE_READ_ONLY
        value: "true"
      - key: AEROSPACE_PROGNOSTICS_CONSOLE_ACCESS_TOKEN
        sync: false
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
